# Vérifie que le site compile correctement et valide le contenu avant fusion
name: "Vérification — Pull Request"

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'content/**'
      - 'data/**'
      - 'static/**'
      - 'layouts/**'
      - 'config/**'
      - 'assets/**'
      - 'scripts/**'
      - 'themes/**'
      - 'i18n/**'
      - '.github/workflows/**'

permissions:
  contents: read

# Un seul run par PR : si un nouveau commit arrive, on annule le précédent.
concurrency:
  group: "preview-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.166.0

jobs:
  build-preview:
    name: Vérification du build Hugo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build with Hugo
        id: hugo-build
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "https://preprod.sarfrance.org/" 2>&1 | tee build-output.txt

      - name: Résumé du build
        if: always()
        run: |
          echo "## 🏗️ Résultat du build Hugo" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.hugo-build.outcome }}" = "success" ]; then
            echo "✅ Le site compile correctement." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Erreur de compilation. Vérifiez les logs ci-dessus." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          PAGES=$(grep -oP 'Pages\s+\|\s+\K\d+' build-output.txt || echo "?")
          echo "- **Pages générées** : $PAGES" >> $GITHUB_STEP_SUMMARY

  validate-content:
    name: Validation du contenu
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHON_VERSION: '3.13'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer les dépendances Python
        run: python -m pip install --quiet -r scripts/requirements.txt

      - name: Vérifier le front matter des fichiers Markdown
        run: |
          echo "## 📝 Vérification du contenu" >> $GITHUB_STEP_SUMMARY
          ERRORS=0
          for f in $(find content -name '*.md'); do
            if ! head -1 "$f" | grep -q '^---'; then
              echo "❌ $f : en-tête front matter manquant (doit commencer par ---)" >> $GITHUB_STEP_SUMMARY
              ERRORS=$((ERRORS + 1))
            fi
            if ! sed -n '/^---$/,/^---$/p' "$f" | grep -q 'title:'; then
              echo "⚠️ $f : champ 'title' manquant dans le front matter" >> $GITHUB_STEP_SUMMARY
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ $ERRORS -eq 0 ]; then
            echo "✅ Front matter de tous les fichiers Markdown valide." >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**$ERRORS problème(s) détecté(s) dans le front matter**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Cohérence des données (schémas, metadata, i18n, CSS, parité, agenda)
        run: |
          echo "## 🔎 Vérifications de cohérence des données" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # `check_data.py` imprime son rapport en Markdown ; on le capture pour
          # le pousser dans le résumé GitHub, puis on relaie son code de sortie.
          python scripts/check_data.py | tee -a $GITHUB_STEP_SUMMARY
          exit ${PIPESTATUS[0]}
