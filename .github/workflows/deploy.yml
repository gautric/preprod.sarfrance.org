# Build et déploiement du site Hugo sur GitHub Pages
name: "Déploiement — GitHub Pages"

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - 'content/**'
      - 'data/**'
      - 'static/**'
      - 'layouts/**'
      - 'config/**'
      - 'assets/**'
      - 'scripts/**'
      - 'themes/**'
      - 'i18n/**'


  # Rebuild daily at 6:00 UTC to keep upcoming events up to date
  schedule:
    - cron: '0 6 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Minimal baseline permissions at the workflow level: only `build` needs more
# than read, and it never writes. The `deploy` job widens them locally.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.166.0
  PYTHON_VERSION: '3.13'


jobs:
  # Gate job : décide si un build est nécessaire.
  # - push / workflow_dispatch : toujours (un contenu a changé, ou demande manuelle).
  # - schedule (cron quotidien) : uniquement si un événement de data/agenda.yaml a eu
  #   lieu la veille — ce jour-là il bascule du futur vers le passé et le rendu change ;
  #   les autres jours, la sortie du cron serait identique à la veille.
  gate:
    name: Décider si un build est nécessaire
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # Vient de l'étape « always » (push/dispatch) ou « cron » (schedule) ;
      # une seule des deux s'exécute selon le déclencheur.
      should_build: ${{ steps.always.outputs.should_build || steps.cron.outputs.should_build }}
    steps:
      # Hors cron (push / workflow_dispatch) : build systématique, sans checkout
      # ni Python — la décision est immédiate.
      - name: Build systématique (hors cron)
        id: always
        if: github.event_name != 'schedule'
        run: |
          echo "Déclenchement « ${{ github.event_name }} » : build systématique."
          echo "should_build=true" >> "$GITHUB_OUTPUT"
      # Cron : on ne récupère que les deux fichiers nécessaires à la décision
      # (data/agenda.yaml + le script), pas tout le dépôt.
      - name: Checkout (cron)
        if: github.event_name == 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            data/agenda.yaml
            scripts/agenda_build_needed.py
          sparse-checkout-cone-mode: false
      - name: Setup Python (cron)
        if: github.event_name == 'schedule'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Décider (cron)
        id: cron
        if: github.event_name == 'schedule'
        run: |
          pip install --quiet "pyyaml>=6.0,<7"
          # Le script écrit lui-même should_build dans $GITHUB_OUTPUT ; on tolère
          # son code de sortie 1 (aucun événement) sans faire échouer le job.
          python scripts/agenda_build_needed.py || true

  # Build job
  build:
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet requis par Hugo (enableGitInfo: true) pour calculer
          # <lastmod> dans le sitemap : sans cela, toutes les pages portent la
          # date du dernier commit au lieu de leur propre date de modification.
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Generate Excel inventory
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --quiet -r scripts/requirements.txt
          python scripts/export_books_excel.py
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    # Only the deploy job needs to publish to Pages and sign the artifact.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
